pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tacz'

def requireSubmoduleCheckout = { String relativePath ->
    def checkoutDir = file(relativePath)
    if (!checkoutDir.isDirectory() || !new File(checkoutDir, 'settings.gradle').isFile()) {
        throw new GradleException("Missing source dependency submodule '${relativePath}'. Run 'git submodule update --init --recursive' from ${rootDir}.")
    }
    checkoutDir
}

includeBuild(requireSubmoduleCheckout('simplebedrockmodel')) {
    dependencySubstitution {
        substitute module('com.github.mcmodderanchor:simplebedrockmodel') using project(':')
    }
}
